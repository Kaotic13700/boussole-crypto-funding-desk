services:
  - type: cron
    name: boussole-funding-history
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python collect_market_history.py
    envVars:
      - key: HISTORY_DATABASE_URL
        fromDatabase:
          name: boussole-funding-history-db
          property: connectionString

databases:
  - name: boussole-funding-history-db
    databaseName: funding_history
    user: funding_collector

